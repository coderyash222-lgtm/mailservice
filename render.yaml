services:
  - type: web
    name: mail-otp-service
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: coderyash2222@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: coderyash2222@gmail.com
      - key: OTP_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
