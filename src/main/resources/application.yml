server:
  port: ${PORT:8080}

spring:
  application:
    name: mail-otp-service
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:coderyash2222@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

otp:
  app-name: ${OTP_APP_NAME:AuthVerify}
  api-key: ${OTP_API_KEY:}
  secret: ${OTP_SECRET:}
  expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
  max-attempts: ${OTP_MAX_ATTEMPTS:5}
  cooldown-seconds: ${OTP_COOLDOWN_SECONDS:30}
  cleanup-interval-ms: 60000
  keep-alive:
    enabled: ${KEEP_ALIVE_ENABLED:true}
    url: ${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}}
    interval-ms: ${KEEP_ALIVE_INTERVAL_MS:600000}
  mail:
    from: ${SMTP_FROM:${SMTP_USERNAME:coderyash2222@gmail.com}}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:*}

management:
  endpoints:
    web:
      exposure:
        include: health
